name: Linux container and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['linux-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build, test and export release files
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifacts
          build-args: SOURCE_REVISION=${{ github.sha }}
          outputs: type=local,dest=release
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            release/*.tar.gz
            release/SHA256SUMS
      - name: Container tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$image:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/linux-v* ]]; then
            echo "tags=$image:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish container
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: SOURCE_REVISION=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
      - name: Publish experimental release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS \
            --prerelease --title "$GITHUB_REF_NAME" --notes-file docs/linux-release.md
